<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skill Village</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      This paints before any module loads, so it can't import THEME — every
      var(--sv-*, <hex>) below falls back to today's day-time hex until
      theme/index.ts boots and sets the real custom properties on <html>. The
      live values (and how they shift for night, weather, etc.) are owned by
      theme/store.ts:cssVars — change THERE, not here. #171310 (html/body
      background, the letterbox behind the canvas) is the one exception: it
      stays a literal, mirroring THEME.night, since the canvas paints over it
      before any chrome var would matter.
    -->
    <style>
      html, body { margin: 0; height: 100%; background: #171310; overflow: hidden; }
      canvas { display: block; image-rendering: pixelated; }
      #chat-panel {
        /* Above #silent-banner (10): the banner spans the full width, and its
           own × sits exactly where the panel's close button lives. */
        position: fixed; top: 0; right: 0; bottom: 0; width: 320px; z-index: 11;
        background: var(--sv-panel-bg, #FFFDF4); border-left: 3px solid var(--sv-ink, #3A2E22);
        display: flex; flex-direction: column;
        font: 14px/1.5 'IBM Plex Mono', monospace; color: var(--sv-panel-fg, #3A2E22);
      }
      #chat-panel[hidden] { display: none; }
      #chat-panel header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 14px; border-bottom: 2px solid var(--sv-ink, #3A2E22);
        font-family: 'Pixelify Sans', sans-serif; font-size: 18px;
      }
      #chat-close { border: 0; background: none; font-size: 20px; cursor: pointer; }
      #chat-entries { list-style: none; margin: 0; padding: 12px; overflow-y: auto; flex: 1; }
      #chat-entries li { margin-bottom: 10px; padding: 8px 10px; border-radius: 8px; max-width: 90%; }
      #chat-entries li[data-who='player'] { background: var(--sv-chip-player, #E8E0D0); margin-left: auto; }
      #chat-entries li[data-who='creature'] { background: var(--sv-cream, #F2E5C4); border: 1.5px solid var(--sv-ink, #3A2E22); color: var(--sv-ink, #3A2E22); }
      #chat-entries li.thinking { animation: chat-thinking 1.2s ease-in-out infinite; }
      @keyframes chat-thinking {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      #chat-form { padding: 10px; border-top: 2px solid var(--sv-ink, #3A2E22); }
      #chat-input { width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit;
        border: 2px solid var(--sv-ink, #3A2E22); border-radius: 8px; background: var(--sv-panel-bg, #FFFDF4); }
      #silent-banner {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        background: var(--sv-banner-bg, #F2E5C4); border-bottom: 3px solid var(--sv-ink, #3A2E22); color: var(--sv-panel-fg, #3A2E22);
        font: 13px/1.4 'IBM Plex Mono', monospace; padding: 8px 40px 8px 14px;
      }
      #silent-banner small { opacity: 0.7; margin-left: 8px; }
      #silent-banner button {
        position: absolute; right: 8px; top: 4px; border: 0; background: none;
        font-size: 18px; cursor: pointer; color: var(--sv-panel-fg, #3A2E22);
      }
      #sound-hud {
        /* left: 60px, not 12px — the palette arc's ⚙ weather menu owns the
           bottom-left corner (its plan, Task on the menu button); the two
           buttons read as one control row. */
        position: fixed; left: 60px; bottom: 12px; z-index: 12;
        font: 11px/1.4 'IBM Plex Mono', monospace; color: #F2E5C4;
      }
      #sound-mute {
        position: relative;
        width: 36px; height: 36px; font-size: 16px; cursor: pointer;
        background: #F2E5C4; border: 2px solid #3A2E22; border-radius: 6px;
      }
      #sound-mute.locked::after {
        content: ''; position: absolute; top: 3px; right: 3px;
        width: 6px; height: 6px; border-radius: 3px; background: #D97757;
      }
      #sound-popover {
        position: absolute; bottom: 42px; left: 0; width: 170px;
        background: #F2E5C4; color: #3A2E22; border: 2px solid #3A2E22;
        border-radius: 6px; padding: 8px 10px;
      }
      #sound-popover label { display: block; margin: 4px 0; }
      #sound-popover input { width: 100%; accent-color: #D97757; }
      #soundcheck {
        position: fixed; right: 12px; bottom: 12px; z-index: 12; width: 150px;
        display: flex; flex-wrap: wrap; gap: 4px;
      }
      #soundcheck button {
        font: 10px 'IBM Plex Mono', monospace; cursor: pointer;
        background: #F2E5C4; border: 1.5px solid #3A2E22; border-radius: 4px; padding: 3px 6px;
      }
      /* Above the canvas, below #chat-panel (11): the gear sits bottom-left,
         well clear of the panel's own footprint on the right. */
      #weather-menu { position: fixed; left: 14px; bottom: 14px; z-index: 9; }
      #weather-menu-button {
        width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
        background: var(--sv-panel-bg, #FFFDF4); border: 2px solid var(--sv-ink, #3A2E22);
        color: var(--sv-panel-fg, #3A2E22); font-size: 18px; line-height: 1;
      }
      #weather-menu-popover {
        position: absolute; left: 0; bottom: 44px; min-width: 160px;
        background: var(--sv-panel-bg, #FFFDF4); border: 2px solid var(--sv-ink, #3A2E22);
        border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 2px;
        font: 13px/1.4 'IBM Plex Mono', monospace; color: var(--sv-panel-fg, #3A2E22);
      }
      #weather-menu-popover[hidden] { display: none; }
      .weather-menu-row {
        text-align: left; padding: 6px 8px; border: 0; border-radius: 5px;
        background: none; color: inherit; font: inherit; cursor: pointer;
      }
      .weather-menu-row.active { background: var(--sv-cream, #F2E5C4); color: var(--sv-ink, #3A2E22); }
      #weather-menu-chips, #weather-menu-time-chips, #weather-menu-palette-chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 4px 2px; }
      /* The palette row leads the popover, so it carries the divider under it. */
      #weather-menu-palette-chips { border-bottom: 1px solid var(--sv-wood, #8A6B4A); padding-bottom: 5px; }
      .weather-menu-chip {
        padding: 4px 7px; border: 1.5px solid var(--sv-ink, #3A2E22); border-radius: 5px;
        background: none; color: inherit; font: inherit; cursor: pointer;
      }
      .weather-menu-chip.active { background: var(--sv-cream, #F2E5C4); color: var(--sv-ink, #3A2E22); }
      #weather-menu-journey-label { padding: 4px 8px; opacity: 0.8; }
      #weather-menu-note { padding: 4px 8px; opacity: 0.8; font-style: italic; }
      #weather-menu-override-note { padding: 4px 8px; opacity: 0.85; font-style: italic; border-bottom: 1px solid var(--sv-wood, #8A6B4A); color: var(--sv-accent, #D97757); }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

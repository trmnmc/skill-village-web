# Skill Village behind nginx: the built bundle up front, the game server
# behind /api and /ws.
#
# Installed by deploy/bootstrap.sh, which substitutes __DOMAIN__ and friends.
# certbot rewrites the listen/TLS lines in place when you run it afterwards —
# don't hand-edit those back out.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __WEB_ROOT__;
    index index.html;

    # One password for the whole village. It guards /api too, which is the
    # point: those routes accept intents and can spend a chat turn, so an
    # open door there is not the same as an open door to a static page.
    auth_basic "Skill Village";
    auth_basic_user_file __HTPASSWD__;

    # The bundle is one 270kB module; over the wire that is ~100kB gzipped.
    gzip on;
    gzip_types application/javascript text/css;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A chat turn is a claude CLI call with a 30s timeout of its own;
        # nginx's default 60s read timeout would give up first on a slow one.
        proxy_read_timeout 90s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The socket is quiet between state frames — a village with nobody
        # watching ticks once a minute — so the default 60s read timeout
        # would hang up on a perfectly healthy spectator.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Vite fingerprints these, so they can be cached forever; index.html
    # above them is deliberately not, or a deploy would never be seen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}

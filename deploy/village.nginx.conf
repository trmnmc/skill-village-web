# village.fenley.ai — the interactive village (the game people play).
#
# Distinct from the Swarm Showroom vhost in docs/showroom-deploy.md: that one
# serves the read-only spectator bundle off port 8263. This serves the main
# app off 8262, and the two can run side by side on the droplet.
#
# Deliberately fully public, LLM voice included (owner's call, 2026-08-25):
# /v1/chat/completions reaches the robot and spends real API budget for
# anyone who finds the URL. The rate-limit zone below is the one guard that
# stays on — it does not gate viewing, only the cost of shouting at the robot.

limit_req_zone $binary_remote_addr zone=village_llm:10m rate=6r/m;

server {
    server_name village.fenley.ai;

    root /var/www/village-game;
    index index.html;

    # The built bundle is content-hashed; index.html must never be cached or
    # a deploy leaves clients pinned to a stale asset graph.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8262;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The robot's voice. Public by decision; throttled so a crawler or a
    # leaked link cannot drain the budget in one sitting. burst=3 keeps a
    # real conversation smooth.
    location /v1/ {
        limit_req zone=village_llm burst=3 nodelay;
        proxy_pass http://127.0.0.1:8262;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 2m;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8262;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Single-page app: every unknown path falls back to the game itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # DNS + TLS follow the existing fenley.ai certbot setup:
    #   certbot --nginx -d village.fenley.ai
}
